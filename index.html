
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Coin Tap</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#171717;color:white;
 font-family:Arial,sans-serif;text-align:center;
}
header{padding:20px;font-weight:bold;font-size:22px}
.balance{font-size:38px;font-weight:bold;margin-top:25px}
.label{color:#aaa;font-size:12px;margin-top:6px}
.coin{
 width:250px;height:250px;border-radius:50%;
 margin:45px auto;
 background:radial-gradient(circle at 30% 25%,#fff0a0,#e5b735,#93631a);
 border:8px solid #b88924;
 box-shadow:0 12px 0 #664817,0 20px 35px #0009;
 display:flex;align-items:center;justify-content:center;
 color:#8b5d14;font-size:110px;font-weight:bold;
 cursor:pointer;user-select:none;
 transition:transform .08s;
}
.coin:active{transform:scale(.95)}
.stats{display:flex;gap:12px;padding:15px}
.stat{
 flex:1;background:#252525;padding:16px;
 border-radius:15px;font-size:14px;
}
nav{
 position:fixed;bottom:0;left:0;right:0;
 display:flex;justify-content:space-around;
 background:#242424;padding:17px 5px;
}
nav button{
 color:#f5d76e;background:none;border:0;
 font-size:13px;
}
</style>
</head>
<body>
<header>🪙 COIN TAP</header>

<div class="label">YOUR COINS</div>
<div class="balance" id="balance">0</div>

<div class="coin" id="coin">₵</div>

<div class="stats">
 <div class="stat">
  ⚡ ENERGY
  <h3 id="energy">1000 / 1000</h3>
 </div>
 <div class="stat">
  🪙 PER TAP
  <h3>+1 Coin</h3>
 </div>
</div>

<nav>
 <button onclick="show('Tap')">🪙 Tap</button>
 <button onclick="show('Friends')">👥 Friends</button>
 <button onclick="show('Earn')">🎯 Earn</button>
 <button onclick="show('Boost')">⚡ Boost</button>
</nav>

<script>
const tg=window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

let balance=0;
let energy=1000;

document.getElementById('coin').onclick=()=>{
 if(energy<=0)return;
 balance++;
 energy--;
 document.getElementById('balance').textContent=
  balance.toLocaleString();
 document.getElementById('energy').textContent=
  energy+' / 1000';
};

function show(page){
 if(tg)tg.showAlert(page+' section');
 else alert(page);
}
</script>
</body>
</html>
